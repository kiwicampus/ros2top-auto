[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ros2top-auto"
dynamic = ["version"]
description = "Real-time ROS2 node monitor with automatic process discovery — no node code changes required"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
  { name = "robot.com Engineering Team", email = "sgranada@robot.com" },
]
keywords = ["monitoring", "process", "ros2", "gpu", "cpu", "memory", "nodes", "system"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Systems Administration",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "psutil>=5.8.0",
  "pynvml>=11.0.0",
]

[project.scripts]
ros2top-auto = "ros2top.main:main"

[project.urls]
Homepage = "https://github.com/kiwicampus/ros2top-auto.git"
"Bug Reports" = "https://github.com/kiwicampus/ros2top-auto/issues"
Source = "https://github.com/kiwicampus/ros2top-auto.git"

[tool.setuptools.dynamic]
version = { attr = "ros2top.__version__" }

[tool.setuptools.packages.find]
include = ["ros2top*"]
exclude = ["cmake*", "include*", "tests*", "build*"]

# Data-file declarations (optional): include headers and cmake scripts
[tool.setuptools.data-files]
"include/ros2top" = ["include/ros2top/*.hpp"]
"share/ros2top/cmake" = ["cmake/*.cmake"]
